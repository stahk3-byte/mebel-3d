.lbl.ml .gx:hover{color:var(--danger)}
#labels.placing .lbl.ml{pointer-events:none}
/* мышь: крестик «удалить» не занимает место — появляется кружком у правого края подписи, когда навели на цифры */
@media (hover:hover){
  .lbl.ml .gx,.lbl.gl .gx{position:absolute;left:100%;top:50%;width:17px;height:17px;margin:0;padding:0;transform:translate(-5px,-50%);border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;opacity:0;pointer-events:none;transition:opacity .12s}

.search input{flex:1}

/* телефон: узкое окно или телефон, повёрнутый горизонтально (невысокое окно) */
@media (max-width:760px), (max-height:520px) and (max-width:1100px){
  .main{grid-template-columns:1fr}
  #panel-grip{display:none}
  /* телефон: список деталей и карточка выезжают поверх модели снизу — модель не меняет размер */

  .panel{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:40vh;border-left:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.12)}

  .panel.compact .card{border-top:0;padding-block:8px}
  #panel-x{display:inline-block}
  /* телефон: кнопки детали — одна строка, листается пальцем вбок */
  #selcard .row{flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #selcard .row::-webkit-scrollbar{display:none}
  #selcard .row .btn{flex:none;white-space:nowrap}
  #btn-parts{display:inline-block}
  /* телефон: шапка в одну строку — больше места модели */
  .top{flex-wrap:nowrap;gap:8px;padding-block:6px}
  .sel-wrap{flex:0 1 auto}
  .dims{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;text-align:right}
  .dims .dl{display:none}
  .ptitle{flex:1 1 0;gap:6px}
  /* у заказчика на телефоне: название и редакция — первой строкой, габариты — мелко второй */
  .top:has(.ptitle:not([hidden])){flex-wrap:wrap;row-gap:0;padding-block:4px}
  .top:has(.ptitle:not([hidden])) .ptitle{order:1}
  .top:has(.ptitle:not([hidden])) #btn-parts{order:2}
  .top:has(.ptitle:not([hidden])) .dims{order:3;flex:1 1 100%;text-align:left;padding-left:30px;font-size:11px;margin-top:-2px}
  .ptitle .rv-l{display:none}.ptitle .rv-s{display:inline;font-size:12px}

  /* телефон: главная строка — виды, «разнести» и «Ещё»; остальное открывается по «Ещё» второй строкой */

/* ---------- file loading ---------- */
const extOf = f => (f.name.split('.').pop() || '').toLowerCase();
async function loadFiles(files) {
  const map = new Map(); const urls = [];
  for (const f of files) { const u = URL.createObjectURL(f); urls.push(u); map.set(f.name.toLowerCase(), u); }
  const manager = new THREE.LoadingManager();
  let started = false; let doneRes; const done = new Promise(r => { doneRes = r; });
  manager.onStart = () => { started = true; }; manager.onLoad = () => doneRes(); manager.onError = () => {};
  manager.setURLModifier(url => { if (url.startsWith('blob:') || url.startsWith('data:')) return url; let b = url; try { b = decodeURIComponent(url); } catch (e) {} b = b.split(/[\\/]/).pop().toLowerCase(); return map.get(b) || url; });
  const order = ['b3d', '3ds', 'obj', 'glb', 'gltf', 'fbx', 'dae', 'wrl', 'stl'];
  const main = order.map(x => files.find(f => extOf(f) === x)).find(Boolean);
  if (!main) throw new Error('Не нашёл файл модели. Нужен файл Базиса (.b3d) или один из форматов: OBJ, 3DS, STL, GLB/GLTF, FBX, DAE, WRL.');
  const ext = extOf(main); const buf = await main.arrayBuffer(); let obj;
  if (ext === 'b3d') {
    obj = await loadB3D(buf, files);
  } else if (ext === 'obj') {
    const { OBJLoader } = await import('three/addons/loaders/OBJLoader.js');
    const loader = new OBJLoader(manager);
    const mtl = files.find(f => extOf(f) === 'mtl');
    if (mtl) { const { MTLLoader } = await import('three/addons/loaders/MTLLoader.js'); const mc = new MTLLoader(manager).parse(decodeText(await mtl.arrayBuffer()), ''); mc.preload(); loader.setMaterials(mc); }
    obj = loader.parse(decodeText(buf));
  } else if (ext === '3ds') {
    const { TDSLoader } = await import('three/addons/loaders/TDSLoader.js');
    obj = new TDSLoader(manager).parse(buf, '');
  } else if (ext === 'glb' || ext === 'gltf') {
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    obj = await new Promise((res, rej) => new GLTFLoader(manager).parse(buf, '', g => res(g.scene), rej));
  } else if (ext === 'fbx') {
    const { FBXLoader } = await import('three/addons/loaders/FBXLoader.js');
    obj = new FBXLoader(manager).parse(buf, '');
  } else if (ext === 'dae') {
    const { ColladaLoader } = await import('three/addons/loaders/ColladaLoader.js');
    obj = new ColladaLoader(manager).parse(decodeText(buf), '').scene;
  } else if (ext === 'wrl') {
    const { VRMLLoader } = await import('three/addons/loaders/VRMLLoader.js');
    let t = decodeText(buf).replace(/^﻿/, '');
    if (/^#VRML\s+V1\./i.test(t)) throw new Error('Файл в формате VRML 1.0, он не поддерживается. Экспортируйте модель в OBJ или 3DS.');
    t = t.replace(/\r\n?/g, '\n').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ' ');
    t = t.replace(/"[^"\n]*"/g, s => s.replace(/\\/g, '/'));
    const names = new Map(); let k = 0;
    const safe = nm => { if (!names.has(nm)) { const id = 'N' + (k++) + '_'; names.set(nm, id); names.set(id, nm); } return names.get(nm); };
    t = t.replace(/\b(DEF|USE)(\s+)([^\s{}\[\]]+)/g, (m, kw, sp, nm) => kw + sp + safe(nm));
    try { obj = new VRMLLoader(manager).parse(t, ''); }
    catch (e) { throw new Error('Не удалось разобрать WRL-файл (' + (e.message || e) + '). Попробуйте экспорт в OBJ или 3DS, либо пришлите этот файл мне для проверки.'); }
    obj.traverse(o => { if (names.has(o.name)) o.name = names.get(o.name); });
  } else {
    const { STLLoader } = await import('three/addons/loaders/STLLoader.js');
    const g = new STLLoader().parse(buf);
    obj = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xd9d4cc, name: 'STL' })); obj.name = main.name.replace(/\.[^.]+$/, '');
  }
  if (started) await Promise.race([done, new Promise(r => setTimeout(r, 10000))]);
  return { obj, ext, base: main.name.replace(/\.[^.]+$/, ''), cleanup: () => urls.forEach(u => URL.revokeObjectURL(u)) };
}

      else banner('Есть более новая редакция №' + nv + ' — она ещё выкладывается. Обновите страницу через минуту.');
    } catch (e) {}
  })();
  const t = $('#ptitle'); if (t) { t.querySelector('b').textContent = nm; t.querySelector('.rv-l').textContent = rv ? 'Редакция №' + DATA.rev : ''; t.querySelector('.rv-s').textContent = rv ? 'ред. №' + DATA.rev : ''; t.hidden = false; }
}
if (LOCAL) { showDemo(); LIB.start(); }
else if (SERVER && location.hash === '#auto') { canEdit = true; singleWindow(); autoImport(); }
else if (SERVER) {
  canEdit = true; $('#owner').hidden = false; $('#btn-export').hidden = false; renderProjSelect();
  watchStamp(); singleWindow();
  if (fromHash) openProject(fromHash);
  else if (DATA.projects.length) openProject(DATA.projects[DATA.projects.length - 1]);
  else { showDemo(); banner('Нажмите «Добавить модель» и выберите файл из Базис-Мебельщика.'); }
  setTimeout(() => { if (!showBazisReview()) showBazisLink(); }, 900);
  window.addEventListener('hashchange', () => { const p = DATA.projects.find(x => '#' + x.id === location.hash); if (p) openProject(p); });
  checkInbox();
  (async function waitPublic(n) {
    let pub = ''; try { pub = (await (await fetch('/api/info', { cache: 'no-store' })).json()).publicUrl || ''; } catch (e) {}
    if (pub) { $('#btn-link').title = 'Ссылки работают: ' + pub; if (n > 0) toast('Ссылки для заказчиков готовы', 3000); return; }
    setTimeout(() => waitPublic(n + 1), 4000);
  })(0);
}
else {
  if (fromHash) openProject(fromHash);
  else if (!DATA.projects.length) showDemo();
  else if (DATA.viewerOnly) openProject(DATA.projects[0]);
  else $('#loading').textContent = 'Открываю модель…';
  window.addEventListener('hashchange', () => { const p = DATA.projects.find(x => '#' + x.id === location.hash); if (p) openProject(p); });
  if (!DATA.viewerOnly) initCaps();
}
</script></body></html>
